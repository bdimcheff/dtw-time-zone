name: Deploy feed function (code)

# The function's code changes rarely; its data changes ~40 times a year. This
# workflow covers the code, and it shares the data with update.yml, because the
# archive reaches main by two routes and neither workflow can cover both:
#
#   - The collector's own push, made with GITHUB_TOKEN, which does not start a
#     workflow run. The paths filter below therefore never fires for it, which
#     is why update.yml deploys the function inline instead.
#   - A review PR merged by hand, which is an ordinary push that this filter
#     does catch. update.yml cannot cover this one: its deploy is gated on the
#     diff of the commit *that run* made, and a run that collects nothing makes
#     no commit at all, so it reports no change. Without data/posts.json below,
#     an admitted post would sit in the archive undeployed until some unrelated
#     collection happened to touch posts.json -- and every scheduled run's
#     Verify would fail in the meantime, since its walk asserts the endpoint
#     serves exactly what data/posts.json holds.
on:
  push:
    branches: [main]
    paths:
      # posts.json alone: pending.json and denied.json are review state and are
      # not bundled into the function. See above for which of the two pushes
      # that write this file can reach the filter.
      - "data/posts.json"
      # Deliberately the whole of src/, not the function's import graph. The
      # filter has to track two graphs at once: what the bundle imports
      # (functions/index.ts, lib/skeleton.ts, config.ts) *and* what produces
      # entries.json at build time (build.ts, lib/store.ts, lib/order.ts). Only
      # the first is mechanical, and a change to the second that this list
      # missed would leave the function serving a stale ordering with nothing
      # failing -- update.yml would not cover it either, since it gates on
      # data/posts.json changing. The job is ~2 minutes and the code changes
      # rarely, so over-triggering is the cheap side of the trade.
      - "src/**"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-feed-function
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Before the deploy, not after: this is the one path that ships the
      # paginator, so it is the one path that must not ship it ungated.
      - name: Check
        run: npm run check

      # entries.json comes from the archive; index.js is the esbuild bundle.
      - name: Build
        run: |
          npm run build
          npm run build:functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # --only functions:getFeedSkeleton, never bare --only functions: an
      # unqualified deploy deletes functions absent from source, and this
      # credential is shared with the hosting deploy.
      # --force: without an Artifact Registry cleanup policy a non-interactive
      # deploy ships the function and *then* fails asking for one.
      - name: Deploy
        run: >
          npx --yes firebase-tools deploy
          --only functions:getFeedSkeleton
          --project dtw-time-zone
          --non-interactive --force
