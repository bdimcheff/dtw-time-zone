name: Update feed

on:
  # Review PRs edit data/ by hand, and the invariants in the corpus tests are
  # exactly what a half-finished edit breaks. Catching it here is the difference
  # between a red PR and a scheduled run that wedges silently.
  pull_request:
    paths: ["data/**", "src/**", "package.json", ".github/workflows/**"]
  schedule:
    # Four times a day. GitHub disables scheduled workflows after 60 days
    # without repository activity; re-enable from the Actions tab when it does.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      full_sweep:
        description: "Run an unwindowed sweep of the variant queries"
        type: boolean
        default: false

concurrency:
  group: update-feed
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  # Runs on pull requests only. A review PR hand-edits data/, and the corpus
  # invariants are exactly what a half-finished edit breaks -- a denied URI added
  # without deleting the queue entry, say. Failing here keeps that out of main
  # instead of letting it wedge a scheduled run.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Typecheck only. The corpus invariants deliberately run *after* collect:
      # collect is what repairs them -- it filters denied entries at load and
      # reclassifies the queue -- so asserting them first would wedge every run on
      # a hand-edit that the very next step would have fixed.
      - name: Typecheck
        run: npm run typecheck

      - name: Collect posts
        id: collect
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          FULL_SWEEP: ${{ inputs.full_sweep }}
        run: |
          if [ "$FULL_SWEEP" = "true" ]; then
            npm run collect -- --full
          else
            npm run collect
          fi

      # Now that collect has repaired and rewritten data/, assert the invariants
      # over what will actually be committed and deployed.
      - name: Check
        run: npm run check

      # All three data files are committed to main together. An earlier version
      # routed pending.json through a bot branch, which force-pushed over any
      # review commits and silently discarded removals when no new candidates
      # were found. state.json changes every run, so this commits every run --
      # accepted as an audit trail rather than adding cache plumbing.
      - name: Commit data
        id: commit
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          # Carried through so a re-collect repeats the sweep this run was asked
          # for; a full sweep that lost a push race would otherwise silently
          # continue as a windowed run.
          FULL_SWEEP: ${{ inputs.full_sweep }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Derived from the commit rather than from the collect step's outputs:
          # the re-collect below writes to this step's GITHUB_OUTPUT, not that
          # one, so those counts go stale the moment a push race happens.
          report() {
            # An if, not `grep -q ... && changed=true`: steps run under `bash -e`,
            # where a failing && chain at statement level exits the step -- and
            # grep finding nothing is the normal case.
            local changed=false
            if git show --name-only --format= HEAD | grep -qx 'data/pending.json'; then
              changed=true
            fi
            {
              echo "pending_changed=$changed"
              echo "total_pending=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/pending.json","utf8")).length)')"
            } >> "$GITHUB_OUTPUT"
          }

          commit_data() {
            git add data/
            if git diff --cached --quiet; then
              echo "no data changes"
              return 1
            fi
            git commit -q -m "$1"
          }

          if ! commit_data "Update archive: ${{ steps.collect.outputs.new_posts }} new post(s), ${{ steps.collect.outputs.new_pending }} new candidate(s)"; then
            echo "pending_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          report

          # A review PR merging while this job runs would otherwise fail the push
          # and skip the deploy entirely. The plain rebase is the fast path, but
          # it cannot be the only one: a review PR rewrites the same JSON arrays
          # this run did, so it conflicts, and a conflicted rebase is left in
          # progress -- every later attempt would then die on the stale
          # rebase-merge directory instead of retrying anything. data/ is derived,
          # so the correct resolution is always to re-collect against the newer
          # base rather than to merge two versions of a generated file.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed; re-collecting on top of origin/main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard FETCH_HEAD
            if [ "$FULL_SWEEP" = "true" ]; then
              npm run collect -- --full
            else
              npm run collect
            fi
            if ! commit_data "Update archive (re-collected on $(git rev-parse --short HEAD))"; then
              echo "pending_changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            report
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1

      # After the push, not before: the rebase can bring in a review PR that
      # admitted posts, and building first would deploy a skeleton missing them
      # while the commit log claimed they were live. public/ is gitignored, so
      # nothing here needs committing.
      - name: Build feed
        run: npm run build

      # An issue, not a PR: the collector rewrites pending.json every run, so a
      # bot branch would clobber whatever a reviewer committed to it.
      # Advisory only: whether a notification issue opened has no bearing on
      # whether the built skeleton should ship, and this step sits between the
      # data commit and the deploy.
      - name: Open review issue for pending variants
        if: steps.commit.outputs.pending_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run --silent pending-report > /tmp/body.md

          # The label has to exist before it can be filtered on, and `--jq
          # '.[0].number'` prints the literal string "null" on an empty list --
          # which is truthy in shell, so the comment branch would run
          # `gh issue comment null`. `// empty` yields a genuinely empty string.
          gh label create pending-review --color FBCA04 \
            --description "Candidate posts awaiting review" 2>/dev/null || true
          existing=$(gh issue list --label pending-review --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
          else
            gh issue create --label pending-review \
              --title "Review candidate variant posts (${{ steps.commit.outputs.total_pending }} awaiting)" \
              --body-file /tmp/body.md
          fi

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dtw-time-zone
          channelId: live

      # The feed fails in a confusing way if these regress: the DID stops
      # resolving, or the AppView rejects the skeleton's content type.
      - name: Verify deployment
        run: npm run verify
