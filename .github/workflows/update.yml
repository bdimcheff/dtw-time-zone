name: Update feed

on:
  # No paths filter: the job is ~30s, and a filtered-out PR reports no checks at
  # all, which in the UI is indistinguishable from a PR that passed. See the
  # `check` job below for why pull requests are gated at all.
  pull_request:
  schedule:
    # Every half hour. This cadence *is* the feed's latency: the archive is
    # bundled into the skeleton function, so a post does not appear until a run
    # collects it and redeploys (see "Deploy feed function (archive stale)").
    # Every run is a full sweep of ~3 requests, so frequency is close to free.
    # Offset off the hour because scheduled runs queue at low priority and the
    # top of the hour is the worst time to ask.
    #
    # GitHub disables scheduled workflows after 60 days without repository
    # activity; re-enable from the Actions tab when it does.
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  # Runs on pull requests only. A review PR hand-edits data/, and the corpus
  # invariants are exactly what a half-finished edit breaks -- a denied URI added
  # without deleting the queue entry, say. Failing here keeps that out of main
  # instead of letting it wedge a scheduled run.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keyed to the PR, so a push supersedes its own earlier check and nothing
    # else. Sharing a group with `update` would have them cancel each other:
    # GitHub cancels a pending run when a newer one queues in the same group.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Bounded well under GitHub's 6-hour default: the retry schedule can stall for
    # a long time under sustained rate limiting, and a run wedged for hours would
    # block the next scheduled window without producing anything.
    timeout-minutes: 45
    # Deliberately NOT shared with deploy-functions.yml, even though both deploy
    # getFeedSkeleton and both are now triggered by data/posts.json. Sharing a
    # group would make a merge's deploy *pending* behind a running collection,
    # and GitHub cancels a pending run when a newer one queues -- the next
    # half-hourly tick would delete the deploy that ships the merged post. The
    # two therefore race, and the staleness gate below is what settles it.
    concurrency:
      group: update-feed
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Typecheck only. The corpus invariants deliberately run *after* collect:
      # collect is what repairs them -- it filters denied entries at load and
      # reclassifies the queue -- so asserting them first would wedge every run on
      # a hand-edit that the very next step would have fixed.
      - name: Typecheck
        run: npm run typecheck

      - name: Collect posts
        id: collect
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: npm run collect

      # Now that collect has repaired and rewritten data/, assert the invariants
      # over what will actually be committed and deployed.
      - name: Check
        run: npm run check

      # All three data files are committed to main together. An earlier version
      # routed pending.json through a bot branch, which force-pushed over any
      # review commits and silently discarded removals when no new candidates
      # were found. A run that changes nothing now commits nothing: commit_data
      # returns 1, and both deploy gates below then read "0".
      - name: Commit data
        id: commit
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Derived from the commit rather than from the collect step's outputs:
          # the re-collect below writes to this step's GITHUB_OUTPUT, not that
          # one, so those counts go stale the moment a push race happens.
          # Counts URIs added to the queue by this commit, not merely whether the
          # file changed: a run that only promotes or drops entries would
          # otherwise open an issue titled "(0 awaiting)" reading "No posts are
          # awaiting review".
          report() {
            local added
            added=$(node -e '
              const cp = require("child_process");
              const at = (rev) => {
                try {
                  return JSON.parse(cp.execSync("git show " + rev + ":data/pending.json",
                    {encoding: "utf8", stdio: ["ignore", "pipe", "ignore"]}));
                } catch { return []; }
              };
              const before = new Set(at("HEAD^").map((p) => p.uri));
              console.log(at("HEAD").filter((p) => !before.has(p.uri)).length);
            ')
            # The feed function carries a copy of the archive in its bundle, so it
            # has to be redeployed when -- and only when -- posts.json changes.
            local posts_changed=0
            if ! git diff --quiet HEAD^ HEAD -- data/posts.json; then posts_changed=1; fi
            {
              echo "added_pending=$added"
              echo "posts_changed=$posts_changed"
              echo "total_pending=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/pending.json","utf8")).length)')"
            } >> "$GITHUB_OUTPUT"
          }

          commit_data() {
            git add data/
            if git diff --cached --quiet; then
              echo "no data changes"
              return 1
            fi
            git commit -q -m "$1"
          }

          if ! commit_data "Update archive: ${{ steps.collect.outputs.new_posts }} new post(s), ${{ steps.collect.outputs.new_pending }} new candidate(s)"; then
            { echo "added_pending=0"; echo "posts_changed=0"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          report

          # A review PR merging while this job runs would otherwise fail the push
          # and skip the deploy entirely. The plain rebase is the fast path, but
          # it cannot be the only one: a review PR rewrites the same JSON arrays
          # this run did, so it conflicts, and a conflicted rebase is left in
          # progress -- every later attempt would then die on the stale
          # rebase-merge directory instead of retrying anything. data/ is derived,
          # so the correct resolution is always to re-collect against the newer
          # base rather than to merge two versions of a generated file.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed; re-collecting on top of origin/main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard FETCH_HEAD
            npm run collect
            if ! commit_data "Update archive (re-collected on $(git rev-parse --short HEAD))"; then
              { echo "added_pending=0"; echo "posts_changed=0"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Re-collected after the Check step ran, so re-assert the invariants
            # here; otherwise the one path that regenerates data/ mid-job is the
            # one path that ships it ungated.
            npm run check
            report
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1

      # Everything below this line reads the working tree -- the bundle, the
      # staleness gate, Verify -- so the tree has to be main, not main as of
      # checkout. A review PR merging mid-run is the case: its own deploy ships
      # the admitted post, and this job would then build an archive without it,
      # find the endpoint "stale" for exactly that reason, and deploy the post
      # back out of the feed. Both later Verifys would agree with each other and
      # pass, because both read the same stale file.
      #
      # The commit paths above already rebase onto origin/main. The no-change
      # path -- ~17,500 runs a year, and the only path the gate is active on --
      # exits before reaching one, which is why this is a step of its own rather
      # than a line inside Commit data. data/ is derived and public/ is
      # gitignored, so there is nothing here for a hard reset to lose.
      - name: Sync to main
        run: |
          git fetch origin main
          git reset --hard FETCH_HEAD

      # After the push and the sync, not before: either can bring in a review PR
      # that admitted posts, and building first would deploy a skeleton missing
      # them while the commit log claimed they were live. public/ is gitignored,
      # so nothing here needs committing.
      - name: Build feed
        run: npm run build

      # An issue, not a PR: the collector rewrites pending.json every run, so a
      # bot branch would clobber whatever a reviewer committed to it.
      # Advisory only: whether a notification issue opened has no bearing on
      # whether the built skeleton should ship, and this step sits between the
      # data commit and the deploy.
      - name: Open review issue for pending variants
        if: steps.commit.outputs.added_pending != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run --silent pending-report > /tmp/body.md

          # The label has to exist before it can be filtered on, and `--jq
          # '.[0].number'` prints the literal string "null" on an empty list --
          # which is truthy in shell, so the comment branch would run
          # `gh issue comment null`. `// empty` yields a genuinely empty string.
          gh label create pending-review --color FBCA04 \
            --description "Candidate posts awaiting review" 2>/dev/null || true
          existing=$(gh issue list --label pending-review --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
          else
            gh issue create --label pending-review \
              --title "Review candidate variant posts (${{ steps.commit.outputs.total_pending }} awaiting)" \
              --body-file /tmp/body.md
          fi

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dtw-time-zone
          channelId: live

      # Asks the deployed endpoint whether it is already serving what this
      # checkout holds, which is the actual precondition for the deploy below.
      # `posts_changed` alone cannot answer that: it reads the diff of the commit
      # *this run* made, so it is blind to a post admitted by a merged review PR,
      # to one lost when that merge's deploy raced this workflow's, and to the
      # rebase at the end of Commit data pulling either in after report() ran.
      # Each of those leaves the archive committed and undeployed, with nothing
      # here able to notice and every later run failing at Verify.
      #
      # verify's walk is exactly that comparison -- it asserts the endpoint
      # serves precisely data/posts.json -- so it is reused as the gate rather
      # than reimplemented. `--archive` is what keeps it an honest gate: a full
      # run also asserts hosting and the published feed record, and a function
      # deploy cannot change either, so gating on those would redeploy every
      # half hour forever over a stale FEED_NAME. The full run still follows.
      #
      # Skipped when this run's own commit already answers the question -- both
      # so the ~40 runs a year that collect something do not pay for a probe they
      # cannot learn anything from, and so those runs do not show a step that is
      # red by construction.
      - name: Is the deployed archive current?
        id: deployed
        if: steps.commit.outputs.posts_changed != '1'
        continue-on-error: true
        run: npm run verify -- --archive

      # The skeleton is a function with the archive bundled into it, so a new post
      # is not reachable until the function itself is redeployed -- hosting only
      # carries did.json and describeFeedGenerator now. Still ~40 runs a year;
      # the other ~17,500 find the gate above green and skip it.
      #
      # This lives here as well as in deploy-functions.yml's paths filter because
      # that workflow triggers on push, and the push this job makes is made with
      # GITHUB_TOKEN, which does not start a workflow run. The filter there
      # deploys a merged review PR immediately; this step is what makes that
      # merely faster than waiting for the next tick, rather than the only way
      # the post ever ships.
      #
      # Before Verify, deliberately: the walk in verify asserts the endpoint serves
      # exactly what data/posts.json holds, which is only true once this has run.
      - name: Deploy feed function (archive stale)
        if: steps.commit.outputs.posts_changed == '1' || steps.deployed.outcome == 'failure'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm run build:functions
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          # --only functions:getFeedSkeleton, never bare --only functions: an
          # unqualified deploy deletes functions absent from source.
          npx --yes firebase-tools deploy \
            --only functions:getFeedSkeleton \
            --project dtw-time-zone \
            --non-interactive --force
          rm -f "$RUNNER_TEMP/gcp-key.json"

      # The feed fails in a confusing way if these regress: the DID stops resolving,
      # the AppView rejects a content type, or the cursor walk stops short and
      # subscribers silently see one page again.
      - name: Verify deployment
        run: npm run verify
